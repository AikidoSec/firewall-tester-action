services:
  test-ip-lists-monitoring:
    profiles:
      - policies
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: AIK_RUNTIME_1_test-ip-lists-monitoring
      DATABASE_NAME: test-ip-lists-monitoring
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-ip-lists-monitoring${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
