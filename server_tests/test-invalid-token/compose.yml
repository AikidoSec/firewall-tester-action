services:
  test-invalid-token:
    profiles:
      - core-integration
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: AIK_RUNTIME_1_1_INVALID
      DATABASE_NAME: test-invalid-token
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-invalid-token${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
