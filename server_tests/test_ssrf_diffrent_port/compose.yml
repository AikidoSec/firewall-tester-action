services:
  test:
    depends_on:
      ssrf_mock_4000:
        condition: service_started

  ssrf_mock_4000:
    image: alpine:3.20
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    volumes:
      - ./server_tests/test_ssrf_diffrent_port/mock-4000.sh:/mock-4000.sh:ro
    command: sh /mock-4000.sh
