services:
  linux_server:
    image: python:3.13-alpine
    platform: linux/amd64
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                body = b"linux-ok"
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *_):
                return

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080', timeout=1).read()"
      interval: 1s
      timeout: 5s
      retries: 30

  win_to_linux_probe:
    image: mcr.microsoft.com/windows/servercore:ltsc2022
    platform: windows/amd64
    depends_on:
      linux_server:
        condition: service_healthy
    command:
      - powershell
      - -NoProfile
      - -Command
      - |
        $$body = (Invoke-WebRequest -UseBasicParsing http://linux_server:8080 -TimeoutSec 10).Content
        if ($$body -ne 'linux-ok') {
          throw "Unexpected Linux response: $$body"
        }

  win_server:
    image: mcr.microsoft.com/windows/servercore:ltsc2022
    platform: windows/amd64
    command:
      - powershell
      - -NoProfile
      - -Command
      - |
        $$listener = [System.Net.HttpListener]::new()
        $$listener.Prefixes.Add('http://+:8080/')
        $$listener.Start()
        while ($$true) {
          $$context = $$listener.GetContext()
          $$body = [Text.Encoding]::UTF8.GetBytes('windows-ok')
          $$context.Response.ContentType = 'text/plain'
          $$context.Response.ContentLength64 = $$body.Length
          $$context.Response.OutputStream.Write($$body, 0, $$body.Length)
          $$context.Response.Close()
        }
    healthcheck:
      test:
        - CMD-SHELL
        - powershell -NoProfile -Command "try { $$body = (Invoke-WebRequest
          -UseBasicParsing http://127.0.0.1:8080 -TimeoutSec 1).Content; if
          ($$body -eq 'windows-ok') { exit 0 } } catch {}; exit 1"
      interval: 1s
      timeout: 5s
      retries: 30

  linux_to_win_probe:
    image: python:3.13-alpine
    platform: linux/amd64
    depends_on:
      win_server:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import urllib.request

        body = urllib.request.urlopen("http://win_server:8080", timeout=10).read()
        if body != b"windows-ok":
            raise SystemExit(f"Unexpected Windows response: {body!r}")

  win_loopback_probe:
    image: mcr.microsoft.com/windows/servercore:ltsc2022
    platform: windows/amd64
    command:
      - powershell
      - -NoProfile
      - -Command
      - |
        $$deadline = (Get-Date).AddSeconds(60)
        $$lastError = ''
        while ((Get-Date) -lt $$deadline) {
          try {
            $$body = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4000 -TimeoutSec 2).Content
            if ($$body -eq 'loopback-ok') {
              exit 0
            }
            $$lastError = "Unexpected loopback response: $$body"
          } catch {
            $$lastError = $$_.Exception.Message
          }
          Start-Sleep -Seconds 1
        }
        throw "Loopback sidecar was not reachable: $$lastError"

  loopback_sidecar:
    image: python:3.13-alpine
    platform: linux/amd64
    network_mode: service:win_loopback_probe
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                body = b"loopback-ok"
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *_):
                return

        ThreadingHTTPServer(("127.0.0.1", 4000), Handler).serve_forever()
