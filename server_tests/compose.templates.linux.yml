services:
  setup_template:
    image: ${TEST_RUNNER_IMAGE:-firewall-tester-action-test-runner}
    build:
      context: ..
      dockerfile: server_tests/Dockerfile.runner
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    environment:
      CORE_URL: http://core:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      PGPASSWORD: mysecretpassword
    command:
      - sh
      - /workspace/server_tests/setup.linux.sh

  app_template:
    image: ${DEMO_IMAGE:-firewall-tester-action-demo-image}
    build:
      context: ${DEMO_CONTEXT:?Set DEMO_CONTEXT to the demo app build context}
      dockerfile: ${DEMO_DOCKERFILE:-Dockerfile}
      args:
        DOTNET_BUILD_ARGS: ${DOTNET_BUILD_ARGS:-}
        MSBUILD_ARGS: ${MSBUILD_ARGS:-}
        PHP_FIREWALL_VERSION: ${PHP_FIREWALL_VERSION:-}
    env_file:
      - ${APP_ENV_FILE:-./empty.env}
      - ${APP_ENV_FILE_2:-./empty.env}
      - ./default.env
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      PORT: ${APP_PORT:-8080}
    restart: 'no'

  test_template:
    image: ${TEST_RUNNER_IMAGE:-firewall-tester-action-test-runner}
    build:
      context: ..
      dockerfile: server_tests/Dockerfile.runner
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace/server_tests
    environment:
      TEST_CORE_HOST: core
      TEST_DNS_MOCK_URL: ${TEST_DNS_MOCK_URL:-}
      TEST_APP_LOG_FILE: ${TEST_APP_LOG_FILE:-}
      PYTHONPATH: /workspace/server_tests
      APP_PORT: ${APP_PORT:-8080}
      APP_READY_TIMEOUT: ${APP_READY_TIMEOUT:-120}
      SLEEP_BEFORE_TEST: ${SLEEP_BEFORE_TEST:-0}
      CONFIG_UPDATE_DELAY: ${CONFIG_UPDATE_DELAY:-60}
      CONTROL_SERVER_PORT: ${CONTROL_SERVER_PORT:-}
    command:
      - sh
      - -c
      - |
        set -eu

        control_server_port="$$CONTROL_SERVER_PORT"
        if [ -z "$$control_server_port" ]; then
          case "$$TEST_NAME" in
            control_test_*) control_server_port=8081 ;;
          esac
        fi

        if [ -z "$$control_server_port" ]; then
          python - <<'PY'
        import os
        import time
        import requests

        url = f"http://{os.environ['TEST_SERVER_HOST']}:{os.environ['APP_PORT']}/"
        deadline = time.monotonic() + int(os.environ.get("APP_READY_TIMEOUT", "120"))
        last_error = None
        while time.monotonic() < deadline:
            try:
                requests.get(url, timeout=5)
                break
            except Exception as e:
                last_error = e
                print(f"Waiting for app at {url}: {e}", flush=True)
                time.sleep(2)
        else:
            raise SystemExit(f"App did not become reachable at {url}: {last_error}")
        PY

        fi

        # Keep the old runner's sleep_before_test behavior: the app can be started
        # or HTTP-ready before the agent has fetched startup config from core.
        if [ "$$SLEEP_BEFORE_TEST" -gt 0 ]; then
          sleep "$$SLEEP_BEFORE_TEST"
        fi

        extra_args=""
        if [ -n "$$control_server_port" ]; then
          extra_args="--control_server_port $$control_server_port"
        fi

        python "/workspace/server_tests/$$TEST_NAME/test.py" \
          --test_name "$$TEST_NAME" \
          --server_port "$$APP_PORT" \
          --token "$$TEST_TOKEN" \
          --core_port 3000 \
          --config_update_delay "$$CONFIG_UPDATE_DELAY" \
          $$extra_args
    restart: 'no'
