services:
  setup_template:
    image: ${TEST_RUNNER_IMAGE:?Set TEST_RUNNER_IMAGE}
    build:
      context: ..
      dockerfile: server_tests/Dockerfile.runner
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    environment:
      CORE_URL: http://core:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
    command:
      - sh
      - /workspace/server_tests/setup.linux.sh

  app_template:
    image: ${DEMO_IMAGE:?Set DEMO_IMAGE}
    build:
      context: ${DEMO_CONTEXT:?Set DEMO_CONTEXT to the demo app build context}
      dockerfile: ${DEMO_DOCKERFILE:-Dockerfile}
      args:
        DOTNET_BUILD_ARGS: ${DOTNET_BUILD_ARGS:-}
        MSBUILD_ARGS: ${MSBUILD_ARGS:-}
        PHP_FIREWALL_VERSION: ${PHP_FIREWALL_VERSION:-}
    env_file:
      - ${APP_ENV_FILE:-./empty.env}
      - ${APP_ENV_FILE_2:-./empty.env}
      - ./default.env
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
      PORT: ${APP_PORT:-8080}
    restart: 'no'

  # IMDS responder for fixed metadata IPs used by SSRF tests.
  imds_mock_template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command: python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    environment:
      PORT: 80
      READY_FILE: /tmp/ssrf-imds-ready
      RESPONSE_BODY: '{"Code": "Success"}'
      ENABLE_IPV6: 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE']) else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      imds_aws:
        ipv4_address: 169.254.169.254
      imds_alibaba:
        ipv4_address: 100.100.100.200
      imds_aws_ipv6:
        ipv6_address: ${IMDS_AWS_IPV6_ADDRESS:?Set IMDS_AWS_IPV6_ADDRESS}

  loopback_mock_template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command: python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE'])
          else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    restart: 'no'

  test_template:
    image: ${TEST_RUNNER_IMAGE:?Set TEST_RUNNER_IMAGE}
    build:
      context: ..
      dockerfile: server_tests/Dockerfile.runner
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace/server_tests
    environment:
      TEST_CORE_HOST: core
      TEST_DNS_MOCK_URL: ${TEST_DNS_MOCK_URL:-}
      TEST_APP_LOG_FILE: ${TEST_APP_LOG_FILE:-}
      PYTHONPATH: /workspace/server_tests
      APP_PORT: ${APP_PORT:-8080}
      APP_READY_TIMEOUT: ${APP_READY_TIMEOUT:-120}
      SLEEP_BEFORE_TEST: ${SLEEP_BEFORE_TEST:-0}
      CONFIG_UPDATE_DELAY: ${CONFIG_UPDATE_DELAY:-60}
      CONTROL_SERVER_PORT: ${CONTROL_SERVER_PORT:-}
      SKIP_IPV6_SSRF: ${SKIP_IPV6_SSRF:-0}
    command:
      - sh
      - -c
      - |
        set -eu

        control_server_port="$$CONTROL_SERVER_PORT"
        if [ -z "$$control_server_port" ]; then
          case "$$TEST_NAME" in
            control_test_*) control_server_port=8081 ;;
          esac
        fi

        if [ -z "$$control_server_port" ]; then
          python - <<'PY'
        import os
        import time
        import requests

        url = f"http://{os.environ['TEST_SERVER_HOST']}:{os.environ['APP_PORT']}/"
        deadline = time.monotonic() + int(os.environ.get("APP_READY_TIMEOUT", "120"))
        last_error = None
        while time.monotonic() < deadline:
            try:
                requests.get(url, timeout=5)
                break
            except Exception as e:
                last_error = e
                print(f"Waiting for app at {url}: {e}", flush=True)
                time.sleep(2)
        else:
            raise SystemExit(f"App did not become reachable at {url}: {last_error}")
        PY

        fi

        # Keep the old runner's sleep_before_test behavior: the app can be started
        # or HTTP-ready before the agent has fetched startup config from core.
        if [ "$$SLEEP_BEFORE_TEST" -gt 0 ]; then
          sleep "$$SLEEP_BEFORE_TEST"
        fi

        extra_args=""
        if [ -n "$$control_server_port" ]; then
          extra_args="--control_server_port $$control_server_port"
        fi

        python "/workspace/server_tests/$$TEST_NAME/test.py" \
          --test_name "$$TEST_NAME" \
          --server_port "$$APP_PORT" \
          --token "$$TEST_TOKEN" \
          --core_port 3000 \
          --config_update_delay "$$CONFIG_UPDATE_DELAY" \
          $$extra_args
    restart: 'no'
