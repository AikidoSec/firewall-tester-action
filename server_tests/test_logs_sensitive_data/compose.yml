x-test-name: &test_name test_logs_sensitive_data
x-test-token: &test_token AIK_RUNTIME_1_test_logs_sensitive_data
x-app-service: &app_service app_test_logs_sensitive_data
x-database-name: &database_name test_logs_sensitive_data

services:
  setup_test_logs_sensitive_data:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_logs_sensitive_data:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_NAME: *database_name
      DATABASE_URL: '${DATABASE_URL_PREFIX:?Set DATABASE_URL_PREFIX}test_logs_sensitive_data${DATABASE_URL_SUFFIX:?Set DATABASE_URL_SUFFIX}'
    depends_on:
      setup_test_logs_sensitive_data:
        condition: service_completed_successfully
      log_collector_test_logs_sensitive_data:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: tcp://${SYSLOG_COLLECTOR_HOST:-127.0.0.1}:${SYSLOG_COLLECTOR_PORT:-5514}
        tag: '{{.Name}}'

  test_logs_sensitive_data:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
      TEST_APP_LOG_FILE: ${TEST_LOG_DIR:-/logs}/test_logs_sensitive_data.log
    depends_on:
      app_test_logs_sensitive_data:
        condition: service_started
    volumes:
      - test_logs_sensitive_data_logs:${TEST_LOG_DIR:-/logs}:ro

  log_collector_test_logs_sensitive_data:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    environment:
      SYSLOG_COLLECTOR_LOG_FILE: /logs/test_logs_sensitive_data.log
    volumes:
      - ../syslog_collector.py:/syslog_collector.py:ro
      - test_logs_sensitive_data_logs:/logs
    ports:
      - '${SYSLOG_COLLECTOR_BIND_ADDRESS:-127.0.0.1}:${SYSLOG_COLLECTOR_PORT:-5514}:5514'
    command: python /syslog_collector.py
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('127.0.0.1',
          5514), 1).close()"
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  test_logs_sensitive_data_logs:
