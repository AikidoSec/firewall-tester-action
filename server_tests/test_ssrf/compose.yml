include:
  - ../../compose.${CONTAINER_OS:-linux}.yml

services:
  test:
    depends_on:
      ssrf_mock_4000:
        condition: service_started
      imds_mock:
        condition: service_started

  ssrf_mock_4000:
    image: alpine:3.20
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    volumes:
      - ./mock-4000.sh:/mock-4000.sh:ro
    command: sh /mock-4000.sh

  imds_mock:
    image: python:3.12-alpine
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    cap_add:
      - NET_ADMIN
    volumes:
      - ./mock-imds.py:/mock-imds.py:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache iproute2
        python /mock-imds.py 169.254.169.254 100.100.100.200 fd00:ec2::254
