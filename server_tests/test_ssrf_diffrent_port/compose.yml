x-test-name: &test_name test_ssrf_diffrent_port
x-test-token: &test_token AIK_RUNTIME_1_test_ssrf_diffrent_port
x-app-service: &app_service app_test_ssrf_diffrent_port
x-database-name: &database_name test_ssrf_diffrent_port

services:
  setup_test_ssrf_diffrent_port:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_ssrf_diffrent_port:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_NAME: *database_name
      DATABASE_URL: '${DATABASE_URL_PREFIX:?Set DATABASE_URL_PREFIX}test_ssrf_diffrent_port${DATABASE_URL_SUFFIX:?Set DATABASE_URL_SUFFIX}'
    depends_on:
      setup_test_ssrf_diffrent_port:
        condition: service_completed_successfully

  test_ssrf_diffrent_port:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
    depends_on:
      app_test_ssrf_diffrent_port:
        condition: service_started
      ssrf_mock_4000_test_ssrf_diffrent_port:
        condition: service_healthy

  # Loopback responder for payloads targeting this app container's 127.0.0.1:4000.
  ssrf_mock_4000_test_ssrf_diffrent_port:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    depends_on:
      app_test_ssrf_diffrent_port:
        condition: service_started
    network_mode: service:app_test_ssrf_diffrent_port
    volumes:
      - type: bind
        source: ../mock_http_server.py
        target: ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
        read_only: true
    command: python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    environment:
      HOST: 127.0.0.1
      PORT: 4000
      READY_FILE: /tmp/ssrf-mock-ready
      RESPONSE_BODY: '{"status":"ok"}'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE'])
          else 1)
      interval: 1s
      timeout: 5s
      retries: 60
