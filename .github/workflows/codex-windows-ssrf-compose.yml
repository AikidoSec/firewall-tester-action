name: Codex Windows SSRF Compose

on:
  push: {}

permissions:
  contents: read

jobs:
  dotnet-framework-ssrf:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: Aikido-demo-apps/zen-demo-dotnet-framework
          path: ./zen-demo
          ref: main
          submodules: recursive

      - name: Start Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Service docker -ErrorAction SilentlyContinue

          for ($i = 0; $i -lt 60; $i++) {
            docker version
            if ($LASTEXITCODE -eq 0) {
              docker info
              exit 0
            }
            Start-Sleep -Seconds 2
          }

          throw 'Docker daemon did not become ready.'

      - name: Build Compose images
        shell: pwsh
        env:
          APP_ENV_FILE: ./server_tests/empty.env
          APP_ENV_FILE_2: ./server_tests/empty.env
          APP_PORT: 80
          COMPOSE_PROJECT_NAME: dotnet-framework-ssrf
          DEMO_CONTEXT: ./zen-demo
          DEMO_IMAGE: firewall-tester-action-demo-dotnet-framework-ssrf
        run: |
          $ErrorActionPreference = 'Stop'
          $env:APP_ENV_FILE = (Resolve-Path $env:APP_ENV_FILE).Path
          $env:APP_ENV_FILE_2 = (Resolve-Path $env:APP_ENV_FILE_2).Path
          $env:DEMO_CONTEXT = (Resolve-Path $env:DEMO_CONTEXT).Path

          docker compose --env-file compose.windows.env -f compose.yml --profile build build `
            core `
            demo_app_image `
            test_runner_image

      - name: Run Windows SSRF Compose tests
        shell: pwsh
        env:
          APP_ENV_FILE: ./server_tests/empty.env
          APP_ENV_FILE_2: ./server_tests/empty.env
          APP_PORT: 80
          COMPOSE_PROJECT_NAME: dotnet-framework-ssrf
          CONFIG_UPDATE_DELAY: 60
          DEMO_CONTEXT: ./zen-demo
          DEMO_IMAGE: firewall-tester-action-demo-dotnet-framework-ssrf
          SLEEP_BEFORE_TEST: 10
          TEST_NAMES: |
            test_ssrf
            test_ssrf_diffrent_port
            test_stored_ssrf
            test_stored_ssrf_no_context
        run: |
          $ErrorActionPreference = 'Continue'
          $env:APP_ENV_FILE = (Resolve-Path $env:APP_ENV_FILE).Path
          $env:APP_ENV_FILE_2 = (Resolve-Path $env:APP_ENV_FILE_2).Path
          $env:DEMO_CONTEXT = (Resolve-Path $env:DEMO_CONTEXT).Path

          $compose = @('docker', 'compose', '--env-file', 'compose.windows.env', '-f', 'compose.yml')
          $failures = New-Object System.Collections.Generic.List[string]

          function Invoke-Compose {
            $exe = $compose[0]
            $composeArgs = $compose[1..($compose.Length - 1)]
            & $exe @composeArgs @args
            $script:LastComposeExitCode = $LASTEXITCODE
          }

          function Get-ServiceContainerId {
            param([string] $ServiceName)
            $exe = $compose[0]
            $composeArgs = $compose[1..($compose.Length - 1)]
            $ids = & $exe @composeArgs ps -a -q $ServiceName 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $ids) {
              return ''
            }
            return ($ids | Select-Object -Last 1)
          }

          function Get-ServiceExitCode {
            param([string] $ServiceName)
            $containerId = Get-ServiceContainerId $ServiceName
            if (-not $containerId) {
              return 1
            }
            $exitCode = docker inspect -f '{{.State.ExitCode}}' $containerId 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $exitCode) {
              return 1
            }
            return [int]($exitCode | Select-Object -First 1)
          }

          function Get-ServiceState {
            param([string] $ServiceName)
            $containerId = Get-ServiceContainerId $ServiceName
            if (-not $containerId) {
              return 'missing'
            }
            $state = docker inspect -f '{{.State.Status}}' $containerId 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $state) {
              return 'missing'
            }
            return ($state | Select-Object -First 1)
          }

          function Get-RelatedServices {
            param([string] $TestName)
            $script:AllServices | Where-Object {
              $_ -eq $TestName -or
              $_ -eq "app_$TestName" -or
              $_ -eq "setup_$TestName" -or
              $_ -like "*_$TestName"
            }
          }

          function Write-TestLogs {
            param([string] $TestName)
            $services = @(Get-RelatedServices $TestName | Where-Object { $_ })
            Write-Host "::group::$TestName logs"
            if ($services.Count -gt 0) {
              Invoke-Compose logs --no-color @services
            }
            Invoke-Compose logs --no-color imds_mock
            Write-Host "::endgroup::"
          }

          function Cleanup-Test {
            param([string] $TestName)
            $services = @(Get-RelatedServices $TestName | Where-Object { $_ })
            if ($services.Count -gt 0) {
              Invoke-Compose rm -f -s -v @services *> $null
            }
          }

          function Wait-TestFinished {
            param([string] $TestName)
            $deadline = (Get-Date).AddMinutes(15)
            while ((Get-Date) -lt $deadline) {
              $state = Get-ServiceState $TestName
              if ($state -eq 'exited' -or $state -eq 'dead') {
                return
              }
              Start-Sleep -Seconds 2
            }
            throw "$TestName did not finish within 15 minutes"
          }

          try {
            Invoke-Compose up --no-build -d --wait core postgres imds_mock
            if ($script:LastComposeExitCode -ne 0) {
              throw 'Failed to start shared Windows Compose infrastructure'
            }
            $script:AllServices = Invoke-Compose config --services

            foreach ($testName in ($env:TEST_NAMES -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
              Write-Host "START $testName"
              Invoke-Compose up --no-build -d $testName
              if ($script:LastComposeExitCode -eq 0) {
                Wait-TestFinished $testName
              }
              $exitCode = Get-ServiceExitCode $testName
              Write-TestLogs $testName
              Cleanup-Test $testName

              if ($script:LastComposeExitCode -eq 0 -and $exitCode -eq 0) {
                Write-Host "PASS $testName"
              } else {
                Write-Host "FAIL $testName"
                $failures.Add($testName)
              }
            }
          } finally {
            docker compose --env-file compose.windows.env -f compose.yml down -v --remove-orphans
          }

          if ($failures.Count -gt 0) {
            Write-Host 'Failed tests:'
            $failures | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
            exit 1
          }

