x-test-name: &test_name test_logs_sensitive_data
x-test-token: &test_token AIK_RUNTIME_1_test_logs_sensitive_data
x-app-service: &app_service app_test_logs_sensitive_data
x-database-name: &database_name test_logs_sensitive_data

services:
  setup_test_logs_sensitive_data:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_logs_sensitive_data:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_NAME: *database_name
      DATABASE_URL: '${DATABASE_URL_PREFIX:?Set DATABASE_URL_PREFIX}test_logs_sensitive_data${DATABASE_URL_SUFFIX:?Set DATABASE_URL_SUFFIX}'
    depends_on:
      setup_test_logs_sensitive_data:
        condition: service_completed_successfully
      log_collector_test_logs_sensitive_data:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: tcp://${SYSLOG_COLLECTOR_HOST:-127.0.0.1}:${SYSLOG_COLLECTOR_PORT:-5514}
        tag: '{{.Name}}'

  test_logs_sensitive_data:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
      TEST_APP_LOG_FILE: ${TEST_LOG_DIR:?Set TEST_LOG_DIR}/test_logs_sensitive_data.log
    depends_on:
      app_test_logs_sensitive_data:
        condition: service_started
    volumes:
      - type: volume
        source: test_logs_sensitive_data_logs
        target: ${TEST_LOG_DIR:?Set TEST_LOG_DIR}
        read_only: true

  log_collector_test_logs_sensitive_data:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    environment:
      SYSLOG_COLLECTOR_LOG_FILE: ${TEST_LOG_DIR:?Set TEST_LOG_DIR}/test_logs_sensitive_data.log
    volumes:
      - type: bind
        source: ..
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
      - type: volume
        source: test_logs_sensitive_data_logs
        target: ${TEST_LOG_DIR:?Set TEST_LOG_DIR}
    ports:
      - '${SYSLOG_COLLECTOR_PORT:-5514}:5514'
    command: python ${PYTHON_SYSLOG_COLLECTOR_PATH:?Set PYTHON_SYSLOG_COLLECTOR_PATH}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 5514), 1).close()
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  test_logs_sensitive_data_logs:
