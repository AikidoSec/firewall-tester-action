x-test-name: &test_name test_internet_not_available
x-test-token: &test_token AIK_RUNTIME_1_test_internet_not_available
x-app-service: &app_service app_test_internet_not_available
x-database-name: &database_name test_internet_not_available

services:
  setup_test_internet_not_available:
    extends:
      file: ../compose.templates.${COMPOSE_OS:-linux}.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_internet_not_available:
    extends:
      file: ../compose.templates.${COMPOSE_OS:-linux}.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_NAME: *database_name
      DATABASE_URL: '${DATABASE_URL_PREFIX:-postgres://myuser:mysecretpassword@postgres:5432/}test_internet_not_available${DATABASE_URL_SUFFIX:-?sslmode=disable}'
    depends_on:
      setup_test_internet_not_available:
        condition: service_completed_successfully

  test_internet_not_available:
    extends:
      file: ../compose.templates.${COMPOSE_OS:-linux}.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
    depends_on:
      app_test_internet_not_available:
        condition: service_started
