x-test-name: &test_name test_stored_ssrf_no_context
x-test-token: &test_token AIK_RUNTIME_1_test_stored_ssrf_no_context
x-app-service: &app_service app_test_stored_ssrf_no_context
x-database-url: &database_url 'postgres://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/test_stored_ssrf_no_context?sslmode=disable'

services:
  setup_test_stored_ssrf_no_context:
    extends:
      file: ../compose.templates.linux.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_stored_ssrf_no_context:
    extends:
      file: ../compose.templates.linux.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_URL: *database_url
    depends_on:
      setup_test_stored_ssrf_no_context:
        condition: service_completed_successfully
      dns_mock_test_stored_ssrf_no_context:
        condition: service_started
    dns:
      - 10.254.253.53
    networks:
      - default
      - dns_net_test_stored_ssrf_no_context

  test_stored_ssrf_no_context:
    extends:
      file: ../compose.templates.linux.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
      TEST_DNS_MOCK_URL: http://dns_mock_test_stored_ssrf_no_context:8053
    depends_on:
      app_test_stored_ssrf_no_context:
        condition: service_started
      dns_mock_test_stored_ssrf_no_context:
        condition: service_started
      imds_mock_test_stored_ssrf_no_context:
        condition: service_started

  dns_mock_test_stored_ssrf_no_context:
    image: python:3.13-alpine
    volumes:
      - ../dns_mock.py:/dns_mock.py:ro
    command: python /dns_mock.py
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8053/health',
          timeout=1).read()"
      interval: 1s
      timeout: 5s
      retries: 30
    networks:
      default: null
      dns_net_test_stored_ssrf_no_context:
        ipv4_address: 10.254.253.53

  imds_mock_test_stored_ssrf_no_context:
    image: python:3.12-alpine
    depends_on:
      app_test_stored_ssrf_no_context:
        condition: service_started
    network_mode: service:app_test_stored_ssrf_no_context
    cap_add:
      - NET_ADMIN
    volumes:
      - ./mock-imds.py:/mock-imds.py:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache iproute2
        python /mock-imds.py 169.254.169.254 100.100.100.200 fd00:ec2::254

networks:
  dns_net_test_stored_ssrf_no_context:
    ipam:
      config:
        - subnet: 10.254.253.0/24
