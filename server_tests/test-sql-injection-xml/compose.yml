services:
  test-sql-injection-xml:
    profiles:
      - attacks
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    environment:
      AIKIDO_TOKEN: AIK_RUNTIME_1_test-sql-injection-xml
      DATABASE_NAME: test-sql-injection-xml
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-sql-injection-xml${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
