x-test-name: &test_name test_ssrf
x-test-token: &test_token AIK_RUNTIME_1_test_ssrf
x-app-service: &app_service app_test_ssrf
x-database-url: &database_url 'postgres://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/test_ssrf?sslmode=disable'

services:
  setup_test_ssrf:
    extends:
      file: ../compose.templates.linux.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_ssrf:
    extends:
      file: ../compose.templates.linux.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_URL: *database_url
    depends_on:
      setup_test_ssrf:
        condition: service_completed_successfully
    networks:
      - default
      - imds_aws
      - imds_alibaba
      - imds_aws_ipv6

  test_ssrf:
    extends:
      file: ../compose.templates.linux.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
    depends_on:
      app_test_ssrf:
        condition: service_started
      ssrf_mock_4000_test_ssrf:
        condition: service_healthy
      imds_mock:
        condition: service_healthy

  # Loopback responder for payloads targeting this app container's 127.0.0.1:4000.
  ssrf_mock_4000_test_ssrf:
    image: python:3.13-alpine
    depends_on:
      app_test_ssrf:
        condition: service_started
    network_mode: service:app_test_ssrf
    volumes:
      - ../mock_http_server.py:/mock_http_server.py:ro
    command: python /mock_http_server.py
    environment:
      HOST: 127.0.0.1
      PORT: 4000
      READY_FILE: /tmp/ssrf-mock-ready
      RESPONSE_BODY: '{"status":"ok"}'
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/ssrf-mock-ready
      interval: 1s
      timeout: 5s
      retries: 60
