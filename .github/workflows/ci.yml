name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-coremock-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run bundle:core
      - run: git diff --exit-code -- dist/coremock.cjs

  server-tests-linux:
    name: ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: nodejs
            repository: Aikido-demo-apps/zen-demo-nodejs
            ref: main
            app_port: 3000
            build_args: ''
          - name: python
            repository: Aikido-demo-apps/zen-demo-python
            ref: main
            app_port: 8080
            # 60s config poll + 15s worker cache refresh
            config_update_delay: 75
            build_args: ''
            ignore_failures: true
          - name: php
            repository: Aikido-demo-apps/zen-demo-php
            ref: main
            app_port: 8080
            # 60s config poll + 60s request-processor refresh
            config_update_delay: 120
            app_env_file: ./zen-demo/.env.qa
            build_args: ''
            ignore_failures: true
          - name: dotnet-core
            repository: Aikido-demo-apps/zen-demo-dotnet-core
            ref: main
            app_port: 8080
            build_args: ''
          - name: java
            repository: Aikido-demo-apps/zen-demo-java
            ref: main
            app_port: 8080
            build_args: ''
            ignore_failures: true
          - name: ruby
            repository: Aikido-demo-apps/zen-demo-ruby
            ref: main
            app_port: 3000
            app_env_file: ./zen-demo/.env.qa
            build_args: ''
            ignore_failures: true
          - name: go
            repository: Aikido-demo-apps/zen-demo-go
            ref: main
            app_port: 3000
            build_args: ''
            ignore_failures: true
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout demo app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ matrix.app.repository }}
          path: ./zen-demo
          ref: ${{ matrix.app.ref }}
          submodules: recursive

      - name: Run Compose tests
        uses: $/
        with:
          dockerfile_path: ./zen-demo/Dockerfile
          build_args: ${{ matrix.app.build_args }}
          app_port: ${{ matrix.app.app_port }}
          config_update_delay: ${{ matrix.app.config_update_delay || 60 }}
          ignore_failures: ${{ matrix.app.ignore_failures || false }}
          app_env_file: ${{ matrix.app.app_env_file }}

  server-tests-windows:
    name: dotnet-framework
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout demo app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Aikido-demo-apps/zen-demo-dotnet-framework
          path: ./zen-demo
          ref: main
          submodules: recursive

      - name: Start Docker
        shell: pwsh
        run: |
          Start-Service docker -ErrorAction SilentlyContinue

          for ($i = 0; $i -lt 60; $i++) {
            docker version
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 2
          }

          throw 'Docker daemon did not become ready.'

      - name: Run Compose tests
        uses: $/
        with:
          dockerfile_path: ./zen-demo/Dockerfile
          app_port: 80

  control-tests-linux:
    name: php-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout demo app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Aikido-demo-apps/zen-demo-php
          path: ./zen-demo
          ref: main
          submodules: recursive

      - name: Run Compose control tests
        uses: $/
        with:
          dockerfile_path: ./zen-demo/Dockerfile.qa-control-apache-mod-php
          app_port: 8080
          app_env_file: ./zen-demo/.env.qa
          test_suite: php-control
          ignore_failures: true
