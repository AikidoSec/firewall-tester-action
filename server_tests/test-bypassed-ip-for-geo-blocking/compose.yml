x-test-name: &test-name test-bypassed-ip-for-geo-blocking
x-test-token: &test-token AIK_RUNTIME_1_test-bypassed-ip-for-geo-blocking
x-app-service: &app-service app-test-bypassed-ip-for-geo-blocking
x-database-name: &database-name test-bypassed-ip-for-geo-blocking

services:
  setup-test-bypassed-ip-for-geo-blocking:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: setup-template
    environment:
      TEST_NAME: *test-name
      TEST_TOKEN: *test-token

  app-test-bypassed-ip-for-geo-blocking:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test-token
      DATABASE_NAME: *database-name
      DATABASE_URL: '${DATABASE_URL_PREFIX:?Set DATABASE_URL_PREFIX}test-bypassed-ip-for-geo-blocking${DATABASE_URL_SUFFIX:?Set DATABASE_URL_SUFFIX}'
    depends_on:
      setup-test-bypassed-ip-for-geo-blocking:
        condition: service_completed_successfully

  test-bypassed-ip-for-geo-blocking:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test-template
    environment:
      TEST_NAME: *test-name
      TEST_TOKEN: *test-token
      TEST_SERVER_HOST: *app-service
      TEST_CONTROL_SERVER_HOST: *app-service
    depends_on:
      app-test-bypassed-ip-for-geo-blocking:
        condition: service_started
