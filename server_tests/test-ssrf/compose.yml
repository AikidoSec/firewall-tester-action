services:
  test-ssrf:
    profiles:
      - attacks
      - ssrf
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    depends_on:
      imds-mock:
        condition: service_healthy
    environment:
      AIKIDO_TOKEN: AIK_RUNTIME_1_test-ssrf
      DATABASE_NAME: test-ssrf
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-ssrf${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
    networks:
      default: null
      imds-aws:
        ipv4_address: 169.254.169.100
      imds-alibaba:
        ipv4_address: 100.100.100.100
      imds-aws-ipv6: null

  # Loopback responder for payloads targeting this app container's 127.0.0.1:4000.
  ssrf-mock-4000-test-ssrf:
    profiles:
      - all
      - attacks
      - ssrf
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: loopback-mock-template
    depends_on:
      test-ssrf:
        condition: service_started
    network_mode: service:test-ssrf
    environment:
      HOST: 127.0.0.1
      PORT: 4000
      READY_FILE: /tmp/ssrf-mock-ready
      RESPONSE_BODY: '{"status":"ok"}'
