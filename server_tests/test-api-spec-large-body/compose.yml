services:
  test-api-spec-large-body:
    profiles:
      - core-integration
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: AIK_RUNTIME_1_test-api-spec-large-body
      DATABASE_NAME: test-api-spec-large-body
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-api-spec-large-body${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
