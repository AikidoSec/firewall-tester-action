name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server-tests-linux:
    name: ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: nodejs
            repository: Aikido-demo-apps/zen-demo-nodejs
            ref: main
            app_port: 3000
            app_env_file: ./server_tests/empty.env
            app_env_file_2: ./server_tests/empty.env
            build_args: ''
          - name: python
            repository: Aikido-demo-apps/zen-demo-python
            ref: main
            app_port: 8080
            app_env_file: ./server_tests/empty.env
            app_env_file_2: ./server_tests/empty.env
            build_args: ''
            ignore_failures: true
          - name: php
            repository: Aikido-demo-apps/zen-demo-php
            ref: dev-testing
            app_port: 8080
            config_update_delay: 120
            app_env_file: ./zen-demo/.env.example
            app_env_file_2: ./server_tests/app_env/php.env
            build_args: PHP_FIREWALL_VERSION=1.0.126
            ignore_failures: true
          - name: dotnet-core
            repository: Aikido-demo-apps/zen-demo-dotnet-core
            ref: main
            app_port: 8080
            app_env_file: ./server_tests/empty.env
            app_env_file_2: ./server_tests/empty.env
            build_args: ''
          - name: java
            repository: Aikido-demo-apps/zen-demo-java
            ref: main
            app_port: 8080
            app_env_file: ./server_tests/empty.env
            app_env_file_2: ./server_tests/empty.env
            build_args: ''
            ignore_failures: true
          - name: ruby
            repository: Aikido-demo-apps/zen-demo-ruby
            ref: main
            app_port: 3000
            aikido_client_ip_header: HTTP_X_REAL_IP
            app_env_file: ./server_tests/app_env/ruby.env
            app_env_file_2: ./server_tests/empty.env
            build_args: ''
            ignore_failures: true
          - name: go
            repository: Aikido-demo-apps/zen-demo-go
            ref: main
            app_port: 3000
            app_env_file: ./server_tests/empty.env
            app_env_file_2: ./server_tests/empty.env
            build_args: ''
            ignore_failures: true
    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.app.repository }}
          path: ./zen-demo
          ref: ${{ matrix.app.ref }}
          submodules: recursive

      - name: Run Compose tests
        uses: ./
        env:
          AIKIDO_CLIENT_IP_HEADER: ${{ matrix.app.aikido_client_ip_header || 'X-Real-IP' }}
        with:
          dockerfile_path: ./zen-demo/Dockerfile
          build_args: ${{ matrix.app.build_args }}
          app_port: ${{ matrix.app.app_port }}
          config_update_delay: ${{ matrix.app.config_update_delay || 60 }}
          ignore_failures: ${{ matrix.app.ignore_failures || false }}
          app_env_file: ${{ matrix.app.app_env_file }}
          app_env_file_2: ${{ matrix.app.app_env_file_2 }}

  server-tests-windows:
    name: dotnet-framework
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: Aikido-demo-apps/zen-demo-dotnet-framework
          path: ./zen-demo
          ref: main
          submodules: recursive

      - name: Start Docker
        shell: pwsh
        run: |
          Start-Service docker -ErrorAction SilentlyContinue

          for ($i = 0; $i -lt 60; $i++) {
            docker version
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 2
          }

          throw 'Docker daemon did not become ready.'

      - name: Run Compose tests
        uses: ./
        with:
          dockerfile_path: ./zen-demo/Dockerfile
          app_port: 80
          app_env_file: ./server_tests/empty.env
          app_env_file_2: ./server_tests/empty.env

  control-tests-linux:
    name: php-control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: Aikido-demo-apps/zen-demo-php
          path: ./zen-demo
          ref: apache-mod-php-control-server
          submodules: recursive

      - name: Run Compose control tests
        uses: ./
        with:
          dockerfile_path: ./zen-demo/Dockerfile
          app_port: 8080
          app_env_file: ./zen-demo/.env.example
          app_env_file_2: ./server_tests/app_env/php.env
          test_suite: php-control
          ignore_failures: true
