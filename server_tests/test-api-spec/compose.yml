services:
  app-test-api-spec:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: AIK_RUNTIME_1_test-api-spec
      DATABASE_NAME: test-api-spec
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-api-spec${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
