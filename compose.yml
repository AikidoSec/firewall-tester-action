services:
  # PostgreSQL database image shared by tests; each test uses its own database.
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER} -h 127.0.0.1 -p 5432
      interval: 1s
      timeout: 5s
      retries: 180

  # Core mock API image used by agents to fetch config and submit events.
  core:
    image: ${CORE_IMAGE:?Set CORE_IMAGE}
    build:
      context: .
      dockerfile: ${CORE_DOCKERFILE:?Set CORE_DOCKERFILE}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 1s
      timeout: 5s
      retries: 60

  # Demo app image build target; tests run per-test app services from this image.
  demo_app_image:
    extends:
      file: ./server_tests/compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app_template
    profiles:
      - build

  # Python test runner image build target used by setup and test services.
  test_runner_image:
    extends:
      file: ./server_tests/compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test_template
    profiles:
      - build

  # IMDS responder for fixed metadata IPs used by SSRF tests.
  imds_mock:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    volumes:
      - ./server_tests/mock_http_server.py:/mock_http_server.py:ro
    command: python /mock_http_server.py
    environment:
      PORT: 80
      READY_FILE: /tmp/ssrf-imds-ready
      RESPONSE_BODY: '{"Code": "Success"}'
      ENABLE_IPV6: 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE']) else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      imds_aws:
        ipv4_address: 169.254.169.254
      imds_alibaba:
        ipv4_address: 100.100.100.200
      imds_aws_ipv6:
        ipv6_address: fd00:ec2::254

networks:
  imds_aws:
    ipam:
      config:
        - subnet: 169.254.0.0/16
  imds_alibaba:
    ipam:
      config:
        - subnet: 100.100.100.0/24
  imds_aws_ipv6:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:ec2::/112
