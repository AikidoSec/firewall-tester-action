services:
  suite-runner-template:
    image: ${TEST_RUNNER_IMAGE:?Set TEST_RUNNER_IMAGE}
    isolation: process
    build:
      context: ..
      dockerfile: server_tests/Dockerfile.runner.windows
    volumes:
      - type: bind
        source: ..
        target: C:\workspace
        read_only: true
      - type: bind
        source: ${RUNNER_TEMP_COMPOSE:?Set RUNNER_TEMP_COMPOSE}
        target: C:\results
      - type: volume
        source: test-logs-sensitive-data-logs
        target: ${TEST_LOG_DIR:?Set TEST_LOG_DIR}
        read_only: true
    working_dir: C:\workspace\server_tests
    environment:
      WORKSPACE_ROOT: C:\workspace
      SUITE_RESULTS_DIR: C:\results
      SUITE_TESTS: ${SUITE_TESTS:-}
      SUITE_SKIPPED_TESTS: ${SUITE_SKIPPED_TESTS:-}
      SUITE_MAX_WORKERS: ${SUITE_MAX_WORKERS:-}
      CORE_URL: ${CORE_URL:?Set CORE_URL}
      CORE_HOST: ${CORE_HOST:?Set CORE_HOST}
      POSTGRES_HOST: ${POSTGRES_HOST_IPV4:?Set POSTGRES_HOST_IPV4}
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_ADMIN_PASSWORD:
        ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
      TEST_LOG_DIR: ${TEST_LOG_DIR:?Set TEST_LOG_DIR}
      APP_PORT: ${APP_PORT:-8080}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-600}
      CONFIG_UPDATE_DELAY: ${CONFIG_UPDATE_DELAY:-60}
      CONTROL_SERVER_PORT: ${CONTROL_SERVER_PORT:-}
      SKIP_IPV6_SSRF: ${SKIP_IPV6_SSRF:-0}
    command:
      - python
      - C:\workspace\server_tests\run_suite.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if
          os.path.exists(r'C:\results\setup-complete') else 1)
      interval: 1s
      timeout: 5s
      retries: ${STARTUP_TIMEOUT:-600}
    restart: 'no'

  app-template:
    image: ${DEMO_IMAGE:?Set DEMO_IMAGE}
    isolation: process
    depends_on:
      suite-runner:
        condition: service_healthy
    build:
      context: ${DEMO_CONTEXT:?Set DEMO_CONTEXT to the demo app build context}
      dockerfile: ${DEMO_DOCKERFILE:-Dockerfile}
    env_file:
      - ${APP_ENV_FILE:-./empty.env}
      - ${APP_ENV_FILE_2:-./empty.env}
      - ./test.default.env
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
      PORT: ${APP_PORT:-8080}
    entrypoint:
      - powershell
      - -NoProfile
      - -Command
      - |
        if ($$env:APP_HOSTS_ENTRIES) {
          $$hostsPath = "$$env:SystemRoot\System32\drivers\etc\hosts"
          $$env:APP_HOSTS_ENTRIES -split '\|' | Where-Object { $$_.Trim() } | ForEach-Object {
            Add-Content -Path $$hostsPath -Value $$_
          }
        }
        & C:\ServiceMonitor.exe w3svc
        exit $$LASTEXITCODE
    restart: 'no'

  # IMDS responder for fixed IPv4 metadata IPs used by SSRF tests.
  imds-mock-template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    isolation: process
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command:
      python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    environment:
      PORT: 80
      READY_FILE: /tmp/ssrf-imds-ready
      RESPONSE_BODY: '{"Code": "Success"}'
      ENABLE_IPV6: 0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE'])
          else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      imds-aws:
        ipv4_address: 169.254.169.254
      imds-alibaba:
        ipv4_address: 100.100.100.200

  loopback-mock-template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    isolation: process
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command:
      python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE'])
          else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    restart: 'no'

  dns-mock-template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    isolation: process
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command: python ${PYTHON_DNS_MOCK_PATH:?Set PYTHON_DNS_MOCK_PATH}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8053/health',
          timeout=1).read()
      interval: 1s
      timeout: 5s
      retries: 30
    restart: 'no'
