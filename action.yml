name: Aikido Firewall Tester
description: Run one Aikido firewall tester Compose test
author: AikidoSec

branding:
  icon: heart
  color: red

inputs:
  dockerfile_path:
    description: The path to the Dockerfile with the Aikido agent installed
    required: true
  test_name:
    description:
      The server_tests directory to run, for example test_sql_injection
    required: true
  app_port:
    description: The port exposed by the application during Docker runtime
    required: false
    default: '8080'
  config_update_delay:
    description: Delay in seconds after runtime config updates
    required: false
    default: '60'
  sleep_before_test:
    description: Seconds to wait before starting the test
    required: false
    default: '5'
  app_env_file:
    description: Optional env file passed to the application service
    required: false
    default: ''
  app_env_file_2:
    description: Optional second env file passed to the application service
    required: false
    default: ''
  php_firewall_version:
    description: Optional PHP firewall package version build arg
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run Compose test
      shell: bash
      env:
        APP_ENV_FILE: ${{ inputs.app_env_file }}
        APP_ENV_FILE_2: ${{ inputs.app_env_file_2 }}
        APP_PORT: ${{ inputs.app_port }}
        CONFIG_UPDATE_DELAY: ${{ inputs.config_update_delay }}
        PHP_FIREWALL_VERSION: ${{ inputs.php_firewall_version }}
        SLEEP_BEFORE_TEST: ${{ inputs.sleep_before_test }}
        TEST_NAME: ${{ inputs.test_name }}
      run: |
        set -eu

        demo_dockerfile_path="${{ inputs.dockerfile_path }}"
        export DEMO_CONTEXT="$(dirname "$demo_dockerfile_path")"
        export DEMO_DOCKERFILE="$(basename "$demo_dockerfile_path")"
        export APP_ENV_FILE="${APP_ENV_FILE:-$GITHUB_ACTION_PATH/server_tests/empty.env}"
        export APP_ENV_FILE_2="${APP_ENV_FILE_2:-$GITHUB_ACTION_PATH/server_tests/empty.env}"
        export COMPOSE_PROJECT_NAME="$TEST_NAME"
        container_os="$(docker info --format '{{.OSType}}')"

        docker compose \
          -f "$GITHUB_ACTION_PATH/compose.$container_os.yml" \
          -f "$GITHUB_ACTION_PATH/server_tests/$TEST_NAME/compose.yml" \
          up --build --exit-code-from test test

    - name: Clean up Compose test
      if: always()
      shell: bash
      env:
        APP_ENV_FILE: ${{ inputs.app_env_file }}
        APP_ENV_FILE_2: ${{ inputs.app_env_file_2 }}
        APP_PORT: ${{ inputs.app_port }}
        PHP_FIREWALL_VERSION: ${{ inputs.php_firewall_version }}
        TEST_NAME: ${{ inputs.test_name }}
      run: |
        demo_dockerfile_path="${{ inputs.dockerfile_path }}"
        export DEMO_CONTEXT="$(dirname "$demo_dockerfile_path")"
        export DEMO_DOCKERFILE="$(basename "$demo_dockerfile_path")"
        export APP_ENV_FILE="${APP_ENV_FILE:-$GITHUB_ACTION_PATH/server_tests/empty.env}"
        export APP_ENV_FILE_2="${APP_ENV_FILE_2:-$GITHUB_ACTION_PATH/server_tests/empty.env}"
        export COMPOSE_PROJECT_NAME="$TEST_NAME"
        container_os="$(docker info --format '{{.OSType}}')"

        docker compose \
          -f "$GITHUB_ACTION_PATH/compose.$container_os.yml" \
          -f "$GITHUB_ACTION_PATH/server_tests/$TEST_NAME/compose.yml" \
          down -v --remove-orphans
