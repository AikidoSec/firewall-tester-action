services:
  test-no-token-set:
    profiles:
      - core-integration
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN:
      DATABASE_NAME: test-no-token-set
      DATABASE_URL:
        '${DATABASE_URL_PREFIX:?Set
        DATABASE_URL_PREFIX}test-no-token-set${DATABASE_URL_SUFFIX:?Set
        DATABASE_URL_SUFFIX}'
