x-test-name: &test_name test_ssrf_diffrent_port
x-test-token: &test_token AIK_RUNTIME_1_test_ssrf_diffrent_port
x-app-service: &app_service app_test_ssrf_diffrent_port
x-database-url: &database_url 'postgres://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/test_ssrf_diffrent_port?sslmode=disable'

services:
  setup_test_ssrf_diffrent_port:
    extends:
      file: ../compose.templates.linux.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_ssrf_diffrent_port:
    extends:
      file: ../compose.templates.linux.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_URL: *database_url
    depends_on:
      setup_test_ssrf_diffrent_port:
        condition: service_completed_successfully

  test_ssrf_diffrent_port:
    extends:
      file: ../compose.templates.linux.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
    depends_on:
      app_test_ssrf_diffrent_port:
        condition: service_started
      ssrf_mock_4000_test_ssrf_diffrent_port:
        condition: service_started

  ssrf_mock_4000_test_ssrf_diffrent_port:
    image: alpine:3.20
    depends_on:
      app_test_ssrf_diffrent_port:
        condition: service_started
    network_mode: service:app_test_ssrf_diffrent_port
    volumes:
      - ./mock-4000.sh:/mock-4000.sh:ro
    command: sh /mock-4000.sh
