services:
  setup_template:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    volumes:
      - type: bind
        source: ..
        target: C:\workspace
        read_only: true
    working_dir: C:\workspace
    environment:
      CORE_URL: http://core:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    entrypoint:
      - cmd
      - /D
      - /S
      - /C
    command:
      - C:\workspace\server_tests\setup.windows.cmd

  app_template:
    image: ${DEMO_IMAGE:?Set DEMO_IMAGE}
    isolation: process
    build:
      context: ${DEMO_CONTEXT:?Set DEMO_CONTEXT to the demo app build context}
      dockerfile: ${DEMO_DOCKERFILE:-Dockerfile}
      args:
        DOTNET_BUILD_ARGS: ${DOTNET_BUILD_ARGS:-}
        MSBUILD_ARGS: ${MSBUILD_ARGS:-/nologo}
        PHP_FIREWALL_VERSION: ${PHP_FIREWALL_VERSION:-}
    env_file:
      - ${APP_ENV_FILE:-./empty.env}
      - ${APP_ENV_FILE_2:-./empty.env}
      - ./default.env
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
      PORT: ${APP_PORT:-8080}
    restart: 'no'

  # IMDS responder for fixed IPv4 metadata IPs used by SSRF tests.
  imds_mock_template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    isolation: process
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command: python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    environment:
      PORT: 80
      READY_FILE: /tmp/ssrf-imds-ready
      RESPONSE_BODY: '{"Code": "Success"}'
      ENABLE_IPV6: 0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE']) else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      imds_aws:
        ipv4_address: 169.254.169.254
      imds_alibaba:
        ipv4_address: 100.100.100.200

  loopback_mock_template:
    image: ${PYTHON_MOCK_IMAGE:?Set PYTHON_MOCK_IMAGE}
    isolation: process
    volumes:
      - type: bind
        source: .
        target: ${PYTHON_SIDECAR_DIR:?Set PYTHON_SIDECAR_DIR}
        read_only: true
    command: python ${PYTHON_MOCK_HTTP_SERVER_PATH:?Set PYTHON_MOCK_HTTP_SERVER_PATH}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys; sys.exit(0 if os.path.exists(os.environ['READY_FILE'])
          else 1)
      interval: 1s
      timeout: 5s
      retries: 60
    restart: 'no'

  test_template:
    image: ${TEST_RUNNER_IMAGE:?Set TEST_RUNNER_IMAGE}
    build:
      context: ..
      dockerfile: server_tests/Dockerfile.runner.windows
    volumes:
      - type: bind
        source: ..
        target: C:\workspace
        read_only: true
    working_dir: C:\workspace\server_tests
    environment:
      TEST_CORE_HOST: core
      TEST_DNS_MOCK_URL: ${TEST_DNS_MOCK_URL:-}
      TEST_APP_LOG_FILE: ${TEST_APP_LOG_FILE:-}
      PYTHONPATH: C:\workspace\server_tests
      APP_PORT: ${APP_PORT:-8080}
      APP_READY_TIMEOUT: ${APP_READY_TIMEOUT:-120}
      SLEEP_BEFORE_TEST: ${SLEEP_BEFORE_TEST:-0}
      CONFIG_UPDATE_DELAY: ${CONFIG_UPDATE_DELAY:-60}
      CONTROL_SERVER_PORT: ${CONTROL_SERVER_PORT:-}
      SKIP_IPV6_SSRF: ${SKIP_IPV6_SSRF:-0}
    command:
      - powershell
      - -NoProfile
      - -Command
      - |
        $$ErrorActionPreference = 'Stop'

        $$controlServerPort = $$env:CONTROL_SERVER_PORT
        if (-not $$controlServerPort -and $$env:TEST_NAME.StartsWith('control_test_')) {
          $$controlServerPort = '8081'
        }

        if (-not $$controlServerPort) {
          $$appReadyDeadline = (Get-Date).AddSeconds([int]$$env:APP_READY_TIMEOUT)
          $$appReady = $$false
          $$lastWarmupError = ''
          while ((Get-Date) -lt $$appReadyDeadline) {
            try {
              Invoke-WebRequest -UseBasicParsing "http://$$env:TEST_SERVER_HOST`:$$env:APP_PORT/" -TimeoutSec 5 | Out-Null
              $$appReady = $$true
              break
            } catch {
              if ($$_.Exception.Response) {
                $$appReady = $$true
                break
              }
              $$lastWarmupError = $$_.Exception.Message
              Write-Host "Waiting for app at http://$$env:TEST_SERVER_HOST`:$$env:APP_PORT/: $$lastWarmupError"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $$appReady) {
            throw "App did not become reachable at http://$$env:TEST_SERVER_HOST`:$$env:APP_PORT/. Last error: $$lastWarmupError"
          }

        }

        # Keep the old runner's sleep_before_test behavior: the app can be started
        # or HTTP-ready before the agent has fetched startup config from core.
        if ([int]$$env:SLEEP_BEFORE_TEST -gt 0) {
          Start-Sleep -Seconds ([int]$$env:SLEEP_BEFORE_TEST)
        }

        $$extraArgs = @()
        if ($$controlServerPort) {
          $$extraArgs += '--control_server_port'
          $$extraArgs += $$controlServerPort
        }

        & python "C:\workspace\server_tests\$$env:TEST_NAME\test.py" `
          --test_name $$env:TEST_NAME `
          --server_port $$env:APP_PORT `
          --token $$env:TEST_TOKEN `
          --core_port 3000 `
          --config_update_delay $$env:CONFIG_UPDATE_DELAY `
          @extraArgs
        if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
    restart: 'no'
