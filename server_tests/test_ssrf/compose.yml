x-test-name: &test_name test_ssrf
x-test-token: &test_token AIK_RUNTIME_1_test_ssrf
x-app-service: &app_service app_test_ssrf
x-database-name: &database_name test_ssrf

services:
  setup_test_ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: setup_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token

  app_test_ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app_template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test_token
      DATABASE_NAME: *database_name
      DATABASE_URL: '${DATABASE_URL_PREFIX:?Set DATABASE_URL_PREFIX}test_ssrf${DATABASE_URL_SUFFIX:?Set DATABASE_URL_SUFFIX}'
    depends_on:
      setup_test_ssrf:
        condition: service_completed_successfully
    networks:
      default: null
      imds_aws:
        ipv4_address: ${IMDS_AWS_APP_IPV4:?Set IMDS_AWS_APP_IPV4}
      imds_alibaba:
        ipv4_address: ${IMDS_ALIBABA_APP_IPV4:?Set IMDS_ALIBABA_APP_IPV4}
      imds_aws_ipv6: null

  test_ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test_template
    environment:
      TEST_NAME: *test_name
      TEST_TOKEN: *test_token
      TEST_SERVER_HOST: *app_service
      TEST_CONTROL_SERVER_HOST: *app_service
    depends_on:
      app_test_ssrf:
        condition: service_started
      ssrf_mock_4000_test_ssrf:
        condition: service_healthy
      imds_mock:
        condition: service_healthy

  # Loopback responder for payloads targeting this app container's 127.0.0.1:4000.
  ssrf_mock_4000_test_ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: loopback_mock_template
    depends_on:
      app_test_ssrf:
        condition: service_started
    network_mode: service:app_test_ssrf
    environment:
      HOST: 127.0.0.1
      PORT: 4000
      READY_FILE: /tmp/ssrf-mock-ready
      RESPONSE_BODY: '{"status":"ok"}'
