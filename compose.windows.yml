x-windows-runner-image: &windows-runner-image
  image: ${TEST_RUNNER_IMAGE:-firewall-tester-action-test-runner-windows}
  build:
    context: .
    dockerfile: server_tests/Dockerfile.runner.windows

services:
  postgres:
    image: ${POSTGRES_IMAGE:-sokigo/postgresql-windows:15.15-2022}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "%POSTGRES_USER%" -h 127.0.0.1 -p 5432
      interval: 1s
      timeout: 5s
      retries: 180

  core:
    image: ${CORE_IMAGE:-firewall-tester-action-core-windows}
    build:
      context: .
      dockerfile: ${CORE_DOCKERFILE:-src/coremock/Dockerfile.windows}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 1s
      timeout: 5s
      retries: 60

  setup_test:
    image: ${POSTGRES_IMAGE:-sokigo/postgresql-windows:15.15-2022}
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    volumes:
      - type: bind
        source: .
        target: C:\workspace
        read_only: true
    working_dir: C:\workspace
    environment:
      TEST_NAME: ${TEST_NAME:-${COMPOSE_PROJECT_NAME}}
      TEST_TOKEN: AIK_RUNTIME_1_${TEST_NAME:-${COMPOSE_PROJECT_NAME}}
      CORE_URL: http://core:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint:
      - cmd
      - /S
      - /C
    command:
      - |
        set "TEST_DIR=C:\workspace\server_tests\%TEST_NAME%"

        echo %TEST_NAME% | findstr /R "^test_[A-Za-z0-9_]*$ ^control_test_[A-Za-z0-9_]*$" >nul
        if errorlevel 1 (
          echo Invalid TEST_NAME: %TEST_NAME%
          exit /b 1
        )

        if not exist "%TEST_DIR%\test.py" (
          echo Unknown test: %TEST_NAME%
          exit /b 1
        )

        set "DB_EXISTS="
        for /f "delims=" %A in ('psql -h %POSTGRES_HOST% -p %POSTGRES_PORT% -U %POSTGRES_USER% -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '%TEST_NAME%'"') do set "DB_EXISTS=%A"
        if not "%DB_EXISTS%"=="1" (
          createdb -h %POSTGRES_HOST% -p %POSTGRES_PORT% -U %POSTGRES_USER% %TEST_NAME%
          if errorlevel 1 exit /b 1
        )

        > "%TEMP%\app.json" echo {"token":"%TEST_TOKEN%"}
        curl.exe -fsS -X POST "%CORE_URL%/api/runtime/apps" -H "Content-Type: application/json" --data-binary "@%TEMP%\app.json"
        if errorlevel 1 exit /b 1

        if exist "%TEST_DIR%\start_config.json" (
          curl.exe -fsS -X POST "%CORE_URL%/api/runtime/config" -H "Authorization: %TEST_TOKEN%" -H "Content-Type: application/json" --data-binary "@%TEST_DIR%\start_config.json"
          if errorlevel 1 exit /b 1
        )

        if exist "%TEST_DIR%\start_firewall.json" (
          curl.exe -fsS -X POST "%CORE_URL%/api/runtime/firewall/lists" -H "Authorization: %TEST_TOKEN%" -H "Content-Type: application/json" --data-binary "@%TEST_DIR%\start_firewall.json"
          if errorlevel 1 exit /b 1
        )

  app:
    image: ${DEMO_IMAGE:-firewall-tester-action-demo-image-windows}
    build:
      context: ${DEMO_CONTEXT:?Set DEMO_CONTEXT to the demo app build context}
      dockerfile: ${DEMO_DOCKERFILE:-Dockerfile}
      args:
        DOTNET_BUILD_ARGS: ${DOTNET_BUILD_ARGS:-}
        MSBUILD_ARGS: ${MSBUILD_ARGS:-/nologo}
        PHP_FIREWALL_VERSION: ${PHP_FIREWALL_VERSION:-}
    env_file:
      - ${APP_ENV_FILE:-./server_tests/empty.env}
      - ${APP_ENV_FILE_2:-./server_tests/empty.env}
      - ./server_tests/default.env
      - ./server_tests/${TEST_NAME:-${COMPOSE_PROJECT_NAME}}/test.env
    environment:
      PORT: ${APP_PORT:-8080}
      AIKIDO_TOKEN: ${APP_AIKIDO_TOKEN-AIK_RUNTIME_1_${TEST_NAME:-${COMPOSE_PROJECT_NAME}}}
      # prettier-ignore
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${TEST_NAME:-${COMPOSE_PROJECT_NAME}}?sslmode=disable"
    depends_on:
      setup_test:
        condition: service_completed_successfully
    restart: 'no'

  test:
    <<: *windows-runner-image
    depends_on:
      app:
        condition: service_started
    volumes:
      - type: bind
        source: .
        target: C:\workspace
        read_only: true
    working_dir: C:\workspace\server_tests
    environment:
      TEST_NAME: ${TEST_NAME:-${COMPOSE_PROJECT_NAME}}
      TEST_TOKEN: AIK_RUNTIME_1_${TEST_NAME:-${COMPOSE_PROJECT_NAME}}
      TEST_SERVER_HOST: app
      TEST_CONTROL_SERVER_HOST: app
      TEST_CORE_HOST: core
      TEST_DNS_MOCK_URL: ${TEST_DNS_MOCK_URL:-}
      TEST_APP_LOG_FILE: ${TEST_APP_LOG_FILE:-}
      PYTHONPATH: C:\workspace\server_tests
      APP_PORT: ${APP_PORT:-8080}
      APP_READY_TIMEOUT: ${APP_READY_TIMEOUT:-120}
      CONFIG_UPDATE_DELAY: ${CONFIG_UPDATE_DELAY:-60}
      CONTROL_SERVER_PORT: ${CONTROL_SERVER_PORT:-}
    command:
      - powershell
      - -NoProfile
      - -Command
      - |
        $$ErrorActionPreference = 'Stop'

        $$controlServerPort = $$env:CONTROL_SERVER_PORT
        if (-not $$controlServerPort -and $$env:TEST_NAME.StartsWith('control_test_')) {
          $$controlServerPort = '8081'
        }

        if (-not $$controlServerPort) {
          $$appReadyDeadline = (Get-Date).AddSeconds([int]$$env:APP_READY_TIMEOUT)
          $$appReady = $$false
          $$lastWarmupError = ''
          while ((Get-Date) -lt $$appReadyDeadline) {
            try {
              Invoke-WebRequest -UseBasicParsing "http://$$env:TEST_SERVER_HOST`:$$env:APP_PORT/" -TimeoutSec 5 | Out-Null
              $$appReady = $$true
              break
            } catch {
              if ($$_.Exception.Response) {
                $$appReady = $$true
                break
              }
              $$lastWarmupError = $$_.Exception.Message
              Write-Host "Waiting for app at http://$$env:TEST_SERVER_HOST`:$$env:APP_PORT/: $$lastWarmupError"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $$appReady) {
            throw "App did not become reachable at http://$$env:TEST_SERVER_HOST`:$$env:APP_PORT/. Last error: $$lastWarmupError"
          }
        }

        $$extraArgs = @()
        if ($$controlServerPort) {
          $$extraArgs += '--control_server_port'
          $$extraArgs += $$controlServerPort
        }

        & python "C:\workspace\server_tests\$$env:TEST_NAME\test.py" `
          --test_name $$env:TEST_NAME `
          --server_port $$env:APP_PORT `
          --token $$env:TEST_TOKEN `
          --core_port 3000 `
          --config_update_delay $$env:CONFIG_UPDATE_DELAY `
          @extraArgs
        if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
    restart: 'no'
