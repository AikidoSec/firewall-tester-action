x-test-name: &test-name test-stored-ssrf
x-test-token: &test-token AIK_RUNTIME_1_test-stored-ssrf
x-app-service: &app-service app-test-stored-ssrf
x-database-name: &database-name test-stored-ssrf

services:
  setup-test-stored-ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: setup-template
    environment:
      TEST_NAME: *test-name
      TEST_TOKEN: *test-token

  app-test-stored-ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: app-template
    env_file:
      - ./test.env
    environment:
      AIKIDO_TOKEN: *test-token
      DATABASE_NAME: *database-name
      DATABASE_URL: '${DATABASE_URL_PREFIX:?Set DATABASE_URL_PREFIX}test-stored-ssrf${DATABASE_URL_SUFFIX:?Set DATABASE_URL_SUFFIX}'
    depends_on:
      setup-test-stored-ssrf:
        condition: service_completed_successfully
    dns:
      - 127.0.0.1
    networks:
      default: null
      imds-aws:
        ipv4_address: 169.254.169.101
      imds-alibaba:
        ipv4_address: 100.100.100.101
      imds-aws-ipv6: null

  test-stored-ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: test-template
    environment:
      TEST_NAME: *test-name
      TEST_TOKEN: *test-token
      TEST_SERVER_HOST: *app-service
      TEST_CONTROL_SERVER_HOST: *app-service
      TEST_DNS_MOCK_URL: http://app-test-stored-ssrf:8053
    depends_on:
      app-test-stored-ssrf:
        condition: service_started
      dns-mock-test-stored-ssrf:
        condition: service_healthy
      imds-mock:
        condition: service_healthy

  # DNS responder with mutable per-test records for stored SSRF hostnames.
  dns-mock-test-stored-ssrf:
    extends:
      file: ../compose.templates.${COMPOSE_OS:?Set COMPOSE_OS}.yml
      service: dns-mock-template
    depends_on:
      app-test-stored-ssrf:
        condition: service_started
    network_mode: service:app-test-stored-ssrf
